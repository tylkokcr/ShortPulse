[project]
name = "shortpulse-backend"
version = "0.1.0"
description = "Local, open-source AI video agent for short-form vertical content."
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
