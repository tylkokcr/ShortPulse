[project]
name = "shortpulse-backend"
version = "0.1.0"
description = "Local, open-source AI video agent for short-form vertical content."
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# B008 exists because a mutable default is evaluated once at import and
# then shared. FastAPI's parameter markers are how the framework declares
# where an argument comes from — they are evaluated once by design and
# hold no state, so the rule doesn't apply to them.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Query",
]

[tool.ruff.lint.per-file-ignores]
# The .ass subtitle format defines one header field per line; wrapping the
# Format:/Style: lines to satisfy the line-length rule would produce a file
# libass can't parse.
"app/engines/subtitle_engine.py" = ["E501"]

[tool.mypy]
# What the Dockerfile actually runs, not the interpreter a contributor
# happens to have. It cannot be lowered to the 3.11 floor in
# requires-python: numpy's bundled stubs use `type` statements, which are
# 3.12 syntax, so checking at 3.11 fails before it reaches our code.
python_version = "3.12"
files = ["app", "tests"]
# Default strictness on purpose. What has actually cost us deploys is
# attributes and enum members that do not exist (RenderStage.SCRIPT,
# project.user_id) and None reaching a parameter that cannot take it —
# all caught here. --strict adds 100+ findings about missing annotations,
# which is a different and much less urgent problem.
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# Test doubles are the point of a test double: a _CountingConn or a
# StubWebSocket implements the three methods under test and nothing else,
# and a None passed on purpose is how a default gets exercised. Checking
# those bodies produces ~55 findings, none of them bugs. Annotated
# helpers here are still checked, and so is every import.
module = ["tests.*"]
check_untyped_defs = false
# The "we did not check this body" note, which is the whole point above.
disable_error_code = ["annotation-unchecked"]

[[tool.mypy.overrides]]
# Optional extras. TTS is not installed at all (see requirements.txt) and
# the other two ship no annotations; every import of them in this codebase
# is inside the function that needs it.
module = ["TTS.*", "faster_whisper.*", "fontTools.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The database tests share one asyncpg pool across a module. A pool is
# bound to the loop that created it, so tests and fixtures have to run on
# that same loop rather than a fresh per-test one.
asyncio_default_fixture_loop_scope = "module"
asyncio_default_test_loop_scope = "module"
markers = [
    # Reaches a third-party service. Skips itself when unreachable, so it
    # is safe in the default run and still catches a mistyped voice id.
    "network: hits an external API",
]
