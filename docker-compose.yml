# Self-hosted ShortPulse: one command, one origin.
#
#     docker compose up --build
#     open http://localhost:8080
#
# Everything is anonymous and free in this shape — no Supabase, no Stripe,
# no accounts. See backend/.env.example for what turns the hosted shape on.

services:
  # Single entry point. Both the API and the render-progress WebSocket are
  # served from the same origin as the UI, which is what makes the socket
  # work at all: Next's rewrites don't proxy protocol upgrades, so without
  # something in front the browser would need the backend on a port of its
  # own — fine locally, not on a deployment behind one domain.
  proxy:
    image: caddy:2-alpine
    depends_on: [web, api]
    ports: ["8080:80"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    environment:
      # Named in the Caddyfile's connect-src: Supabase is the only origin
      # besides this one that the browser is allowed to talk to. Read from
      # the same variable the web image is built with, so the policy cannot
      # describe a different Supabase project than the client actually
      # calls. Empty in the self-hosted shape, where there is no Supabase
      # and the source simply drops out of the policy.
      SUPABASE_ORIGIN: ${NEXT_PUBLIC_SUPABASE_URL:-}
      # Same value the web image gets as NEXT_PUBLIC_WS_ORIGIN below:
      # the socket the browser opens for render progress, which is a
      # connect-src of its own because ws:// is a different scheme
      # than the page's http://.
      WS_ORIGIN: ${PUBLIC_WS_ORIGIN:-ws://localhost:8080}
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        # Same origin as the page, routed to the API by the proxy above.
        NEXT_PUBLIC_WS_ORIGIN: ${PUBLIC_WS_ORIGIN:-ws://localhost:8080}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
        # Sign-in providers. Empty means email links only, which is the
        # only thing a self-hosted install could offer anyway.
        NEXT_PUBLIC_OAUTH_PROVIDERS: ${NEXT_PUBLIC_OAUTH_PROVIDERS:-}
        # Named on the terms and privacy pages. Empty here: a self-hosted
        # install has no customers and nothing to answer for, and would
        # otherwise publish whoever wrote this file as its data controller.
        NEXT_PUBLIC_OPERATOR_NAME: ${OPERATOR_NAME:-}
        NEXT_PUBLIC_OPERATOR_ADDRESS: ${OPERATOR_ADDRESS:-}
        NEXT_PUBLIC_OPERATOR_EMAIL: ${OPERATOR_EMAIL:-}
        NEXT_PUBLIC_OPERATOR_TAX_ID: ${OPERATOR_TAX_ID:-}
        NEXT_PUBLIC_OPERATOR_COUNTRY: ${OPERATOR_COUNTRY:-}
        NEXT_PUBLIC_OPERATOR_DATA_REGION: ${OPERATOR_DATA_REGION:-}
    environment:
      BACKEND_ORIGIN: http://api:8000
    restart: unless-stopped

  api:
    build: ./backend
    env_file:
      # Order matters: later files win. The defaults describe the compose
      # stack — its Postgres, its origin — and backend/.env is the
      # operator's, so it must come second or a hosted deployment cannot
      # point DATABASE_URL anywhere else. They were `environment:` keys
      # once, which outranks env_file and silently discarded it.
      - ./deploy/defaults.env
      # Optional. Absent, the defaults above and app/core/config.py are the
      # whole configuration and the install runs in its self-hosted shape.
      - path: ./backend/.env
        required: false
    environment:
      # Belong to the image, so they must beat anything env_file carries.
      # A .env written for a dev machine points these at a host path —
      # /opt/homebrew/... , /usr/local/... — that does not exist in here,
      # and the failure is a bare "No such file or directory" from deep
      # inside the visual stage, long after startup has reported healthy.
      FFMPEG_BINARY: ${FFMPEG_BINARY:-ffmpeg}
      FFPROBE_BINARY: ${FFPROBE_BINARY:-ffprobe}
    volumes:
      # Renders and the downloaded Piper/Whisper models. Outside the image
      # so a rebuild doesn't discard either.
      - shortpulse-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: shortpulse
      POSTGRES_PASSWORD: shortpulse
      POSTGRES_DB: shortpulse
    volumes:
      - shortpulse-db:/var/lib/postgresql/data
    healthcheck:
      # The API applies its migrations at startup, so it must not start
      # before Postgres can actually answer.
      test: ["CMD-SHELL", "pg_isready -U shortpulse"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  shortpulse-data:
  shortpulse-db:
