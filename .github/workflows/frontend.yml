# The mirror of backend.yml, for the same reason: Dependabot opens a
# grouped frontend pull request every week and nothing was checking it.
#
# check-messages is here rather than folded into lint because it is the
# one failure this project cannot see any other way — next-intl renders a
# missing key as its own path, so the build passes, the page looks
# finished, and "app.library.title" is what the user reads.
name: Frontend

on:
  push:
    branches: [master, studio-editor]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: messages
        run: npm run check-messages

      - name: lint
        run: npm run lint

      # Without the Supabase keys this builds in the self-hosted shape,
      # which is the shape that must keep working anyway — and it is a
      # real compile of every page either way.
      - name: build
        run: npm run build
